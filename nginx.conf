server {
    listen 80;
    listen [::]:80;
    server_name machinetrading.ir;
    root /usr/share/nginx/html;
    index index.html;
    
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443;
    listen [::]:443;
    server_name machinetrading.ir;
    root /usr/share/nginx/html;
    index index.html;
    
    location / {
        try_files $uri $uri/ /index.html;
    }
}
